<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UE5 Level Preview</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Consolas, monospace; background: #0a0a1a; color: #ccc; }

#app { display: flex; width: 100%; height: 100%; }

/* ---- Left Sidebar ---- */
#sidebar {
    width: 340px; min-width: 340px; height: 100%;
    background: #1a1a2e; border-right: 1px solid #2a2a4a;
    display: flex; flex-direction: column; overflow: hidden;
    user-select: none;
}
#sidebar h2 {
    padding: 12px 16px; font-size: 14px; font-weight: 600;
    background: #16213e; color: #e0e0ff; border-bottom: 1px solid #2a2a4a;
    letter-spacing: 0.5px; text-transform: uppercase;
}
#actor-list {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    border-bottom: 1px solid #2a2a4a;
}
#actor-list::-webkit-scrollbar { width: 6px; }
#actor-list::-webkit-scrollbar-track { background: #1a1a2e; }
#actor-list::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 3px; }

/* Export button */
#export-btn {
    display: block;
    width: calc(100% - 24px);
    margin: 12px;
    padding: 10px;
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: background 0.2s;
}
#export-btn:hover { background: #ff6b81; }
#export-btn:active { background: #c0392b; }
#export-btn:disabled { opacity: 0.5; cursor: default; }

/* Tree items */
.tree-node { }
.tree-header {
    display: flex; align-items: center; padding: 5px 8px;
    cursor: pointer; border-bottom: 1px solid #1a1a30;
    transition: background 0.15s;
    min-height: 28px;
}
.tree-header:hover { background: #22224a; }
.tree-header.selected { background: #0f3460; }
.tree-toggle {
    display: inline-block; width: 16px; font-size: 10px;
    color: #6666aa; cursor: pointer; flex-shrink: 0;
    transition: transform 0.15s;
    text-align: center;
}
.tree-toggle.expanded { transform: rotate(90deg); }
.tree-spacer { display: inline-block; width: 16px; flex-shrink: 0; }
.tree-children { }

.actor-name {
    font-size: 12px; color: #e0e0ff; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.actor-mesh {
    font-size: 10px; color: #6666aa; margin-left: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.group-name {
    font-size: 12px; color: #8888cc; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.actor-loc {
    font-size: 10px; color: #555577; margin-left: auto; flex-shrink: 0;
    padding-left: 6px;
}

/* ---- Transform Section ---- */
.transform-section {
    padding: 12px 16px; border-bottom: 1px solid #2a2a4a;
}
.transform-section h3 {
    font-size: 12px; color: #8888cc; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.5px;
}
.transform-row {
    display: flex; align-items: center; margin-bottom: 4px; gap: 6px;
}
.transform-row label {
    width: 20px; font-size: 11px; color: #8888aa; text-align: right; flex-shrink: 0;
}
.transform-row input {
    flex: 1; background: #16213e; border: 1px solid #2a2a4a; color: #ccc;
    padding: 4px 6px; font-size: 12px; font-family: 'Consolas', monospace;
    border-radius: 3px; width: 70px;
}
.transform-row input:focus { outline: none; border-color: #4a4a8a; background: #1a2a4e; }

#focus-btn {
    display: block; width: calc(100% - 32px); margin: 10px 16px;
    padding: 8px; background: #0f3460; color: #e0e0ff; border: none;
    border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
    transition: background 0.2s;
}
#focus-btn:hover { background: #1a4a80; }
#focus-btn:disabled { opacity: 0.4; cursor: default; }

/* ---- Model info (GLB mode) ---- */
#model-info {
    padding: 10px 16px; font-size: 11px; color: #6666aa; line-height: 1.6;
    border-bottom: 1px solid #2a2a4a;
}
#model-info b { color: #8888cc; font-weight: 600; }

/* ---- Viewport ---- */
#viewport {
    flex: 1; position: relative; overflow: hidden;
}
#viewport canvas { display: block; }

#info-overlay {
    position: absolute; top: 10px; right: 10px;
    background: rgba(22,33,62,0.85); padding: 10px 14px;
    border-radius: 6px; font-size: 11px; color: #8888cc;
    pointer-events: none; line-height: 1.6;
}


#loading-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10,10,26,0.9); display: flex;
    align-items: center; justify-content: center;
    flex-direction: column; z-index: 100;
}
#loading-overlay.hidden { display: none; }
#loading-overlay .spinner {
    width: 40px; height: 40px; border: 3px solid #2a2a4a;
    border-top-color: #4a6adf; border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-overlay p { margin-top: 16px; color: #8888cc; font-size: 13px; }

/* No-selection message */
#no-selection {
    padding: 16px; color: #555; font-size: 12px; text-align: center;
    font-style: italic;
}
</style>
</head>

<!-- Three.js r160 — ES module imports via importmap -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
// ===========================================================================
// Globals
// ===========================================================================
let scene, camera, renderer;
let viewportEl = null;
let sceneData = null;

// Which of the two things the server is showing:
//   'level' — a .umap, assembled live from per-mesh GLBs + actor transforms
//   'glb'   — one already-converted .glb, loaded and shown as it is
let mode = 'level';
let gridHelper = null;
let actorObjects = {};      // actorName → THREE.Group
let actorDataMap = {};       // actorName → actor data from API
let actorHeaders = {};       // actorName → tree header DOM element
let selectedActor = null;
let glbCache = {};           // meshName → Promise<THREE.Group>

// UE-unit → world-unit scale, reported by the server (--scale).  The exporter
// bakes this factor into the GLB vertices, so every UE distance the viewer
// uses — actor placements, camera, grid, move speed — must be scaled the same
// way or geometry and placement disagree by a factor of 100.
let unitScale = 1.0;

// Camera controls state
let yaw = 0, pitch = 0;     // camera Euler angles (radians)
let moveSpeed = 100;         // world units/sec; sized to the scene on load
let speedMin = 1, speedMax = 100000;   // scroll-wheel limits, same units
let keys = {};
let pointerLocked = false;
let isDraggingRight = false;
let isPanning = false;
let lastMouseX = 0, lastMouseY = 0;

// Camera transform input editing
let camInputFocused = false;

// ===========================================================================
// Coordinate conversion: UE → Three.js / glTF
// ===========================================================================
// UE: left-handed, X-forward, Y-right, Z-up
// Three.js / glTF: right-handed, X-right, Y-up, -Z-forward
// Conversion (must match GLB export in mesh.py):
//   three_x =  ue_y
//   three_y =  ue_z
//   three_z = -ue_x

function ueToThreePos(ueLoc) {
    return new THREE.Vector3(ueLoc.y * unitScale, ueLoc.z * unitScale, -ueLoc.x * unitScale);
}

function threeToUEPos(threePos) {
    return { x: -threePos.z / unitScale, y: threePos.x / unitScale, z: threePos.y / unitScale };
}

// The UE→glTF basis change, C = unitScale · axis-swap, and its inverse.
// Mirrors mesh.py::_basis — the axis swap is orthogonal so it inverts by
// transpose, while the uniform scale inverts to 1/unitScale.
function ueToThreeBasis() {
    const s = unitScale;
    const c = new THREE.Matrix4();
    c.set(
        0,  s,  0, 0,
        0,  0,  s, 0,
       -s,  0,  0, 0,
        0,  0,  0, 1
    );
    const cInv = new THREE.Matrix4();
    const i = 1 / unitScale;
    cInv.set(
        0,  0, -i, 0,
        i,  0,  0, 0,
        0,  i,  0, 0,
        0,  0,  0, 1
    );
    return { conv: c, convInv: cInv };
}

function ueToThreeMatrix(loc, rot, scale) {
    // Build UE transform matrix (4x4)
    const pRad = rot.pitch * Math.PI / 180;
    const yRad = rot.yaw   * Math.PI / 180;
    const rRad = rot.roll  * Math.PI / 180;

    const cp = Math.cos(pRad), sp = Math.sin(pRad);
    const cy = Math.cos(yRad), sy = Math.sin(yRad);
    const cr = Math.cos(rRad), sr = Math.sin(rRad);

    // Build as 4x4 in UE space (row-major for set())
    const m = new THREE.Matrix4();
    m.set(
        cy*cp * scale.x,  (cy*sp*sr - sy*cr) * scale.y,  (cy*sp*cr + sy*sr) * scale.z,  loc.x,
        sy*cp * scale.x,  (sy*sp*sr + cy*cr) * scale.y,  (sy*sp*cr - cy*sr) * scale.z,  loc.y,
        -sp    * scale.x,  (cp*sr)             * scale.y,  (cp*cr)             * scale.z,  loc.z,
        0,                 0,                              0,                              1
    );

    // Coordinate conversion: conv * M * convInv
    // Maps UE (X-fwd, Y-right, Z-up) → Three.js (X-right, Y-up, -Z-fwd)
    // glTF = (UE_Y, UE_Z, -UE_X)
    // The similarity transform is needed because GLB geometry is already
    // in glTF space — we must convert the UE transform to glTF space.  The
    // uniform unitScale cancels out of the rotation/scale part and survives
    // only in the translation, so the instance keeps its own proportions.
    const { conv, convInv } = ueToThreeBasis();

    // result = conv * m * convInv
    const temp = new THREE.Matrix4();
    temp.multiplyMatrices(m, convInv);
    const result = new THREE.Matrix4();
    result.multiplyMatrices(conv, temp);
    return result;
}

// Decompose a Three.js object's world matrix back to UE coordinates
function threeToUETransform(obj) {
    const wm = obj.matrixWorld;
    // Inverse coordinate conversion: Three.js → UE
    // Inverse of (UE_Y, UE_Z, -UE_X) is (-glTF_Z, glTF_X, glTF_Y), and the
    // 1/unitScale in convInv puts the translation back into UE centimetres.
    const { conv, convInv } = ueToThreeBasis();

    // ueMat = convInv * wm * conv  (inverse of the similarity transform)
    const temp = new THREE.Matrix4();
    temp.multiplyMatrices(wm, conv);
    const ueMat = new THREE.Matrix4();
    ueMat.multiplyMatrices(convInv, temp);

    // Extract translation
    const loc = new THREE.Vector3();
    loc.setFromMatrixPosition(ueMat);

    // Extract scale
    const scl = new THREE.Vector3();
    scl.setFromMatrixScale(ueMat);

    // Extract rotation as UE FRotator
    const rotMat = new THREE.Matrix4();
    rotMat.extractRotation(ueMat);
    const te = rotMat.elements;
    const r00=te[0], r01=te[4], r02=te[8];
    const r10=te[1], r11=te[5], r12=te[9];
    const r20=te[2], r21=te[6], r22=te[10];

    let pitchDeg, yawDeg, rollDeg;
    const spVal = -r20;
    if (Math.abs(spVal) < 0.99999) {
        pitchDeg = Math.asin(spVal) * 180 / Math.PI;
        yawDeg = Math.atan2(r10, r00) * 180 / Math.PI;
        rollDeg = Math.atan2(r21, r22) * 180 / Math.PI;
    } else {
        pitchDeg = spVal > 0 ? 90 : -90;
        yawDeg = Math.atan2(-r01, r11) * 180 / Math.PI;
        rollDeg = 0;
    }

    return {
        location: { x: loc.x, y: loc.y, z: loc.z },
        rotation: { pitch: pitchDeg, yaw: yawDeg, roll: rollDeg },
        scale: { x: scl.x, y: scl.y, z: scl.z }
    };
}

// ===========================================================================
// GLB Asset loading
// ===========================================================================
function loadGLB(meshName) {
    if (glbCache[meshName]) return glbCache[meshName];

    const p = fetch(`/Export/Meshes/${meshName}.glb`)
        .then(r => {
            if (!r.ok) throw new Error(`GLB not found: ${meshName}`);
            return r.arrayBuffer();
        })
        .then(arrayBuffer => {
            return new Promise((resolve, reject) => {
                const loader = new GLTFLoader();
                loader.parse(arrayBuffer, '', (gltf) => {
                    resolve(gltf.scene);
                }, (error) => {
                    reject(error);
                });
            });
        })
        .catch(err => {
            console.warn('Failed to load GLB:', meshName, err);
            return null;
        });

    glbCache[meshName] = p;
    return p;
}

// ===========================================================================
// Scene setup
// ===========================================================================
// Lights and grid are per-scene: an Object3D has one parent, so the compare
// pane needs its own instances rather than a share of the live scene's.
function makeEnvironment(target) {
    const ambient = new THREE.AmbientLight(0x404040, 1.0);
    target.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(1, 1, 1).normalize();
    target.add(dirLight);

    // Grid — 100 m across, one cell per metre.  In GLB mode frameModel()
    // replaces it with one sized to the model.
    gridHelper = new THREE.GridHelper(10000 * unitScale, 100, 0x444466, 0x2a2a44);
    target.add(gridHelper);
}

function initThree() {
    viewportEl = document.getElementById('viewport');
    const w = viewportEl.clientWidth;
    const h = viewportEl.clientHeight;

    // Scene
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x16213e);

    // Camera — clip planes and start height are UE centimetres in world units
    camera = new THREE.PerspectiveCamera(60, w / h, 1 * unitScale, 500000 * unitScale);
    camera.position.set(0, 500 * unitScale, 0);

    // Fly speed, likewise: 100 UE cm/sec
    moveSpeed = 100 * unitScale;
    speedMin = 1 * unitScale;
    speedMax = 100000 * unitScale;

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewportEl.appendChild(renderer.domElement);

    makeEnvironment(scene);
    updateViewportSize();

    window.addEventListener('resize', updateViewportSize);
}

function updateViewportSize() {
    const w = viewportEl.clientWidth;
    const h = viewportEl.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
}

// ===========================================================================
// Build scene from API data
// ===========================================================================
// Fetched before initThree() so the world-unit scale is known while the
// camera, grid and fly speed are being sized.
async function fetchSceneData() {
    const resp = await fetch('/api/scene');
    if (!resp.ok) return false;
    sceneData = await resp.json();
    mode = sceneData.mode === 'glb' ? 'glb' : 'level';
    if (typeof sceneData.unit_scale === 'number' && sceneData.unit_scale > 0) {
        unitScale = sceneData.unit_scale;
    }
    return true;
}

async function buildScene() {
    if (mode === 'glb') return buildGLBScene();

    const loadingText = document.getElementById('loading-text');

    const actors = sceneData.actors;
    loadingText.textContent = `Loading ${actors.length} actors…`;

    // Populate actor tree
    populateActorTree(actors);

    // Get unique mesh names that have GLB files
    const meshNames = [...new Set(actors.filter(a => a.has_glb).map(a => a.mesh_name))];
    let loaded = 0;

    // Load all unique GLB files first
    for (const meshName of meshNames) {
        loadingText.textContent = `Loading mesh (${++loaded}/${meshNames.length}): ${meshName}`;
        await loadGLB(meshName);
    }

    // Create objects for each actor
    loadingText.textContent = 'Creating scene objects…';
    let actorIdx = 0;

    // Process in batches to avoid blocking
    function processBatch() {
        const batchSize = 50;
        const end = Math.min(actorIdx + batchSize, actors.length);

        for (; actorIdx < end; actorIdx++) {
            const actor = actors[actorIdx];
            if (actor.has_glb) {
                createActorObject(actor);
            }
        }

        if (actorIdx < actors.length) {
            loadingText.textContent = `Creating objects (${actorIdx}/${actors.length})…`;
            requestAnimationFrame(processBatch);
        } else {
            // Done
            document.getElementById('loading-overlay').classList.add('hidden');

            // Set initial camera from scene data
            if (sceneData.camera.has_camera) {
                setCameraFromUE(sceneData.camera.location, sceneData.camera.rotation);
            } else {
                // Try to find a reasonable default camera position
                fitAllActorsInView();
            }
        }
    }

    if (actors.length > 0) {
        requestAnimationFrame(processBatch);
    } else {
        document.getElementById('loading-overlay').classList.add('hidden');
    }
}

function createActorObject(actor) {
    const glbPromise = glbCache[actor.mesh_name];
    if (!glbPromise) return;

    glbPromise.then(glbScene => {
        if (!glbScene) return;

        // Clone the loaded GLB scene for this actor instance
        const clone = glbScene.clone(true);

        const group = new THREE.Group();
        group.add(clone);
        group.name = actor.name;

        // Apply UE world transform (already in world space from the server)
        // Only the transform is converted; GLB geometry is already in glTF/Three.js space
        const mat4 = ueToThreeMatrix(actor.location, actor.rotation, actor.scale);
        group.matrix.copy(mat4);
        group.matrixAutoUpdate = false;
        group.matrixWorldNeedsUpdate = true;

        scene.add(group);
        actorObjects[actor.name] = group;
        actorDataMap[actor.name] = actor;
    });
}

// ===========================================================================
// GLB mode — show one already-converted file, as it is
// ===========================================================================
// Nothing here goes near a .uasset or a UE transform: the file is loaded and
// added to the scene untouched, which is the point — what you see is what the
// converter actually wrote.
async function buildGLBScene() {
    const loadingText = document.getElementById('loading-text');
    const model = sceneData.model || {};
    const sizeNote = model.size_mb ? ` (${model.size_mb} MB)` : '';
    loadingText.textContent = `Loading ${model.name || 'model'}${sizeNote}…`;

    let gltf;
    try {
        gltf = await new Promise((resolve, reject) => {
            new GLTFLoader().load('/api/model.glb', resolve, xhr => {
                if (xhr.lengthComputable) {
                    const pct = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingText.textContent =
                        `Loading ${model.name || 'model'}${sizeNote} — ${pct}%`;
                }
            }, reject);
        });
    } catch (err) {
        console.error('Failed to load GLB:', err);
        loadingText.textContent = `Failed to load ${model.name || 'the GLB'} `
                                + `— see the browser console.`;
        return;
    }

    scene.add(gltf.scene);
    frameModel(gltf.scene);
    populateNodeTree(gltf.scene);
    showModelInfo(gltf.scene, model);

    document.getElementById('loading-overlay').classList.add('hidden');
}

// Size the viewer from the model's own extent.  A converted GLB carries
// whatever units it was written in — metres by default, centimetres with
// --scale 1.0 — and nothing in the file says which, so measuring the model
// beats trusting a factor: clip planes, grid, fly speed and the opening
// camera all come out sensible either way.
function frameModel(root) {
    const box = new THREE.Box3().setFromObject(root);
    if (box.isEmpty()) return;

    const size = new THREE.Vector3();
    box.getSize(size);
    const center = new THREE.Vector3();
    box.getCenter(center);
    const diag = Math.max(size.length(), 1e-6);

    // Close enough to inspect a surface without clipping through it, far
    // enough to hold the whole model, and a near:far ratio (1:16000) that
    // still leaves the depth buffer room to work.
    camera.near = diag / 2000;
    camera.far = diag * 8;

    // Roughly eight seconds to fly the length of the model, and a wheel range
    // either side of that.
    moveSpeed = diag / 8;
    speedMin = diag / 2000;
    speedMax = diag * 4;

    // Grid a little wider than the footprint, sitting at the model's base
    if (gridHelper) {
        scene.remove(gridHelper);
        gridHelper.geometry.dispose();
        gridHelper.material.dispose();
    }
    const extent = Math.max(size.x, size.z, diag * 0.1) * 1.5;
    gridHelper = new THREE.GridHelper(extent, 40, 0x444466, 0x2a2a44);
    gridHelper.position.set(center.x, box.min.y, center.z);
    scene.add(gridHelper);

    // Open on a three-quarter view of the whole thing
    camera.position.set(center.x + diag * 0.6,
                        center.y + diag * 0.45,
                        center.z + diag * 0.6);
    camera.lookAt(center);
    const euler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
    yaw = euler.y;
    pitch = euler.x;

    updateViewportSize();   // picks up the new clip planes
}

function showModelInfo(root, model) {
    let meshes = 0, tris = 0;
    root.traverse(o => {
        if (!o.isMesh) return;
        meshes++;
        const g = o.geometry;
        tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
    });

    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3();
    box.getSize(size);
    const dim = v => v.toFixed(v < 10 ? 2 : 0);

    document.getElementById('sidebar-title').textContent = 'GLB Contents';
    const info = document.getElementById('model-info');
    info.style.display = 'block';
    // Root children are the placements the exporter wrote; the traversal count
    // is higher because a mesh split across materials becomes several.
    info.innerHTML =
        `<b>${model.name || 'model.glb'}</b>` +
        (model.size_mb ? ` · ${model.size_mb} MB` : '') + '<br>' +
        `${root.children.length.toLocaleString()} nodes · ` +
        `${meshes.toLocaleString()} meshes · ` +
        `${Math.round(tris).toLocaleString()} triangles<br>` +
        `extent ${dim(size.x)} × ${dim(size.y)} × ${dim(size.z)} ` +
        `<span style="color:#555577">(file units)</span>`;
}

// One row per node under the GLB's root — for a level GLB from --export-level
// that is one row per placed actor, since the exporter names nodes after them.
function populateNodeTree(root) {
    const list = document.getElementById('actor-list');
    list.innerHTML = '';

    const nodes = root.children.slice().sort((a, b) =>
        (a.name || '').localeCompare(b.name || ''));

    nodes.forEach((node, i) => {
        const name = node.name || `node_${i}`;
        actorObjects[name] = node;

        const header = document.createElement('div');
        header.className = 'tree-header';
        header.style.paddingLeft = '8px';

        const spacer = document.createElement('span');
        spacer.className = 'tree-spacer';
        header.appendChild(spacer);

        const nameSpan = document.createElement('span');
        nameSpan.className = 'actor-name';
        nameSpan.textContent = name;
        header.appendChild(nameSpan);

        const pos = new THREE.Vector3();
        node.getWorldPosition(pos);
        const locSpan = document.createElement('span');
        locSpan.className = 'actor-loc';
        locSpan.textContent = `${pos.x.toFixed(1)}, ${pos.y.toFixed(1)}, ${pos.z.toFixed(1)}`;
        header.appendChild(locSpan);

        header.dataset.name = name;
        actorHeaders[name] = header;
        header.addEventListener('click', () => selectActor(name));
        list.appendChild(header);
    });

    document.getElementById('no-selection').textContent =
        nodes.length ? 'Click a node to focus it' : 'The GLB has no nodes';
}

// ===========================================================================
// Export scene as GLB
// ===========================================================================
function exportScene() {
    const btn = document.getElementById('export-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Exporting…';

    // Move actor objects into a temporary scene to exclude grid/lights
    const tempScene = new THREE.Scene();
    tempScene.name = 'ExportedScene';
    for (const name in actorObjects) {
        tempScene.attach(actorObjects[name]);
    }

    const exporter = new GLTFExporter();
    exporter.parse(tempScene, (result) => {
        // Move objects back to the main scene
        for (const name in actorObjects) {
            scene.attach(actorObjects[name]);
        }

        // Download the GLB file
        const blob = new Blob([result], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'scene.glb';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        btn.disabled = false;
        btn.textContent = '⬇ EXPORT GLB';
    }, (error) => {
        console.error('Export failed:', error);

        // Move objects back even on error
        for (const name in actorObjects) {
            scene.attach(actorObjects[name]);
        }

        btn.disabled = false;
        btn.textContent = '⬇ EXPORT GLB';
    }, { binary: true });
}

// ===========================================================================
// Actor tree UI (parent-child hierarchy)
// ===========================================================================
function populateActorTree(actors) {
    const list = document.getElementById('actor-list');
    list.innerHTML = '';

    // Build name → actor data map
    const actorMap = {};
    for (const actor of actors) {
        actorMap[actor.name] = actor;
    }

    // Build parent → children map
    const childrenOf = {};  // parentName → [actor, ...]
    const rootItems = [];   // items at root level (actors or virtual groups)

    // Track which virtual groups we've already added to rootItems
    const virtualGroupsAdded = new Set();

    for (const actor of actors) {
        if (actor.parent) {
            if (!childrenOf[actor.parent]) childrenOf[actor.parent] = [];
            childrenOf[actor.parent].push(actor);

            // If parent is not an actor in our list, create a virtual group at root
            if (!actorMap[actor.parent] && !virtualGroupsAdded.has(actor.parent)) {
                virtualGroupsAdded.add(actor.parent);
                rootItems.push({ name: actor.parent, isVirtualGroup: true });
            }
        } else {
            rootItems.push(actor);
        }
    }

    // Sort root items: virtual groups first, then actors by name
    rootItems.sort((a, b) => {
        if (a.isVirtualGroup && !b.isVirtualGroup) return -1;
        if (!a.isVirtualGroup && b.isVirtualGroup) return 1;
        return a.name.localeCompare(b.name);
    });

    // Sort children of each parent by name
    for (const key in childrenOf) {
        childrenOf[key].sort((a, b) => a.name.localeCompare(b.name));
    }

    // Build tree recursively
    function buildTreeNode(item, container, depth) {
        const node = document.createElement('div');
        node.className = 'tree-node';

        const children = childrenOf[item.name] || [];
        const hasChildren = children.length > 0;

        const header = document.createElement('div');
        header.className = 'tree-header';
        header.style.paddingLeft = (depth * 16 + 8) + 'px';

        // Toggle button
        if (hasChildren) {
            const toggle = document.createElement('span');
            toggle.className = 'tree-toggle expanded';
            toggle.textContent = '\u25B6'; // ▶
            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                const childContainer = node.querySelector(':scope > .tree-children');
                if (childContainer) {
                    const isHidden = childContainer.style.display === 'none';
                    childContainer.style.display = isHidden ? 'block' : 'none';
                    toggle.className = isHidden ? 'tree-toggle expanded' : 'tree-toggle';
                }
            });
            header.appendChild(toggle);
        } else {
            const spacer = document.createElement('span');
            spacer.className = 'tree-spacer';
            header.appendChild(spacer);
        }

        if (item.isVirtualGroup) {
            // Virtual group (parent actor not in scene)
            const nameSpan = document.createElement('span');
            nameSpan.className = 'group-name';
            nameSpan.textContent = '\uD83D\uDCC1 ' + item.name;
            header.appendChild(nameSpan);

            const countSpan = document.createElement('span');
            countSpan.className = 'actor-mesh';
            countSpan.textContent = `(${children.length})`;
            header.appendChild(countSpan);
        } else {
            // Real actor
            const actor = item;
            const nameSpan = document.createElement('span');
            nameSpan.className = 'actor-name';
            // Show display name (part after last "/") for composed actors
            const displayName = actor.name.includes('/') ? actor.name.split('/').pop() : actor.name;
            nameSpan.textContent = displayName;
            header.appendChild(nameSpan);

            const meshSpan = document.createElement('span');
            meshSpan.className = 'actor-mesh';
            meshSpan.textContent = actor.mesh_name;
            header.appendChild(meshSpan);

            const locSpan = document.createElement('span');
            locSpan.className = 'actor-loc';
            locSpan.textContent = `${actor.location.x.toFixed(0)}, ${actor.location.y.toFixed(0)}, ${actor.location.z.toFixed(0)}`;
            header.appendChild(locSpan);

            header.dataset.name = actor.name;
            actorHeaders[actor.name] = header;
            header.addEventListener('click', () => selectActor(actor.name));
        }

        node.appendChild(header);

        // Children
        if (hasChildren) {
            const childContainer = document.createElement('div');
            childContainer.className = 'tree-children';
            for (const child of children) {
                buildTreeNode(child, childContainer, depth + 1);
            }
            node.appendChild(childContainer);
        }

        container.appendChild(node);
    }

    for (const item of rootItems) {
        buildTreeNode(item, list, 0);
    }
}

function selectActor(name) {
    // Deselect previous
    if (selectedActor) {
        const prev = actorObjects[selectedActor];
        if (prev) {
            prev.traverse(child => {
                if (child.material && child.material.emissive) {
                    child.material.emissive.setHex(0x000000);
                }
            });
        }
        const prevHeader = actorHeaders[selectedActor];
        if (prevHeader) prevHeader.classList.remove('selected');
    }

    selectedActor = name;

    // Highlight new
    const obj = actorObjects[name];
    if (obj) {
        obj.traverse(child => {
            if (child.material && child.material.emissive) {
                child.material.emissive.setHex(0x112244);
            }
        });
    }

    const header = actorHeaders[name];
    if (header) {
        header.classList.add('selected');
        header.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    // Show transform.  A GLB node has no UE transform behind it, so the
    // editable panel stays hidden there and only Focus is offered.
    const hasUEData = !!actorDataMap[name];
    document.getElementById('no-selection').style.display = hasUEData ? 'none' : '';
    document.getElementById('selected-transform').style.display = hasUEData ? 'block' : 'none';
    document.getElementById('focus-btn').disabled = false;

    updateTransformInputs();
}

function updateTransformInputs() {
    if (!selectedActor) return;
    const actor = actorDataMap[selectedActor];
    if (!actor) return;

    document.getElementById('loc-x').value = actor.location.x.toFixed(1);
    document.getElementById('loc-y').value = actor.location.y.toFixed(1);
    document.getElementById('loc-z').value = actor.location.z.toFixed(1);
    document.getElementById('rot-p').value = actor.rotation.pitch.toFixed(1);
    document.getElementById('rot-y').value = actor.rotation.yaw.toFixed(1);
    document.getElementById('rot-r').value = actor.rotation.roll.toFixed(1);
    document.getElementById('scl-x').value = actor.scale.x.toFixed(2);
    document.getElementById('scl-y').value = actor.scale.y.toFixed(2);
    document.getElementById('scl-z').value = actor.scale.z.toFixed(2);
}

// ===========================================================================
// Transform input handlers
// ===========================================================================
function onTransformInput() {
    if (!selectedActor) return;
    const actor = actorDataMap[selectedActor];
    if (!actor) return;

    // Read values from inputs
    actor.location.x = parseFloat(document.getElementById('loc-x').value) || 0;
    actor.location.y = parseFloat(document.getElementById('loc-y').value) || 0;
    actor.location.z = parseFloat(document.getElementById('loc-z').value) || 0;
    actor.rotation.pitch = parseFloat(document.getElementById('rot-p').value) || 0;
    actor.rotation.yaw   = parseFloat(document.getElementById('rot-y').value) || 0;
    actor.rotation.roll  = parseFloat(document.getElementById('rot-r').value) || 0;
    actor.scale.x = parseFloat(document.getElementById('scl-x').value) || 1;
    actor.scale.y = parseFloat(document.getElementById('scl-y').value) || 1;
    actor.scale.z = parseFloat(document.getElementById('scl-z').value) || 1;

    // Update Three.js object (world position, independent of parent)
    const obj = actorObjects[selectedActor];
    if (obj) {
        const mat4 = ueToThreeMatrix(actor.location, actor.rotation, actor.scale);
        obj.matrix.copy(mat4);
        obj.matrixWorldNeedsUpdate = true;
    }
}

// ===========================================================================
// Camera controls
// ===========================================================================
function setCameraFromUE(loc, rot) {
    // Build camera transform from UE coords
    const mat4 = ueToThreeMatrix(loc, rot, {x:1, y:1, z:1});
    const pos = new THREE.Vector3();
    const quat = new THREE.Quaternion();
    const scl = new THREE.Vector3();
    mat4.decompose(pos, quat, scl);

    camera.position.copy(pos);
    camera.quaternion.copy(quat);

    // Extract yaw/pitch for FPS controls
    const euler = new THREE.Euler().setFromQuaternion(quat, 'YXZ');
    yaw = euler.y;
    pitch = euler.x;
}

function updateCameraFromYawPitch() {
    const quat = new THREE.Quaternion();
    const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
    quat.setFromEuler(euler);
    camera.quaternion.copy(quat);
}

function updateCameraInputs() {
    if (camInputFocused) return;

    // In GLB mode there is no UE frame to report in — a converted file's own
    // coordinates are the only ones that mean anything — so show those.
    if (mode === 'glb') {
        document.getElementById('cam-x').value = camera.position.x.toFixed(2);
        document.getElementById('cam-y').value = camera.position.y.toFixed(2);
        document.getElementById('cam-z').value = camera.position.z.toFixed(2);
        document.getElementById('cam-p').value = (pitch * 180 / Math.PI).toFixed(1);
        document.getElementById('cam-ya').value = (yaw * 180 / Math.PI).toFixed(1);
        document.getElementById('cam-r').value = '0.0';
        return;
    }

    // Convert camera back to UE space
    const ue = threeToUETransform(camera);

    document.getElementById('cam-x').value = ue.location.x.toFixed(1);
    document.getElementById('cam-y').value = ue.location.y.toFixed(1);
    document.getElementById('cam-z').value = ue.location.z.toFixed(1);
    document.getElementById('cam-p').value = ue.rotation.pitch.toFixed(1);
    document.getElementById('cam-ya').value = ue.rotation.yaw.toFixed(1);
    document.getElementById('cam-r').value = ue.rotation.roll.toFixed(1);
}

function onCameraInput() {
    const num = id => parseFloat(document.getElementById(id).value) || 0;

    if (mode === 'glb') {
        camera.position.set(num('cam-x'), num('cam-y'), num('cam-z'));
        pitch = num('cam-p') * Math.PI / 180;
        yaw = num('cam-ya') * Math.PI / 180;
        pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
        updateCameraFromYawPitch();
        return;
    }

    setCameraFromUE(
        { x: num('cam-x'), y: num('cam-y'), z: num('cam-z') },
        { pitch: num('cam-p'), yaw: num('cam-ya'), roll: num('cam-r') }
    );
}

// ===========================================================================
// Focus on selected actor
// ===========================================================================
function focusOnActor() {
    if (!selectedActor) return;
    const obj = actorObjects[selectedActor];
    if (!obj) return;

    // Compute bounding box
    const box = new THREE.Box3();
    obj.traverse(child => {
        if (child.isMesh) {
            child.geometry.computeBoundingBox();
            const childBox = child.geometry.boundingBox.clone();
            childBox.applyMatrix4(child.matrixWorld);
            box.union(childBox);
        }
    });

    if (box.isEmpty()) return;

    const center = new THREE.Vector3();
    box.getCenter(center);
    const size = new THREE.Vector3();
    box.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z);
    const distance = maxDim * 2.5;

    // Position camera looking at center from current direction
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    const newPos = center.clone().sub(dir.multiplyScalar(distance));

    camera.position.copy(newPos);
    camera.lookAt(center);

    // Update yaw/pitch from new orientation
    const euler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
    yaw = euler.y;
    pitch = euler.x;
}

function fitAllActorsInView() {
    const box = new THREE.Box3();
    for (const name in actorObjects) {
        const obj = actorObjects[name];
        obj.traverse(child => {
            if (child.isMesh) {
                child.geometry.computeBoundingBox();
                const childBox = child.geometry.boundingBox.clone();
                childBox.applyMatrix4(child.matrixWorld);
                box.union(childBox);
            }
        });
    }

    if (box.isEmpty()) return;

    const center = new THREE.Vector3();
    box.getCenter(center);
    const size = new THREE.Vector3();
    box.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z);
    const distance = maxDim * 1.5;

    camera.position.set(center.x + distance * 0.5, center.y + distance * 0.6, center.z + distance * 0.5);
    camera.lookAt(center);

    const euler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
    yaw = euler.y;
    pitch = euler.x;
}

// ===========================================================================
// Input event handlers
// ===========================================================================
function setupInputHandlers() {
    const canvas = renderer.domElement;

    // Pointer lock on click
    canvas.addEventListener('click', () => {
        if (!pointerLocked) {
            canvas.requestPointerLock();
        }
    });

    document.addEventListener('pointerlockchange', () => {
        pointerLocked = document.pointerLockElement === canvas;
        if (pointerLocked) {
            document.getElementById('info-overlay').style.opacity = '0.3';
        } else {
            document.getElementById('info-overlay').style.opacity = '1';
        }
    });

    // Mouse move (for camera rotation when pointer locked)
    document.addEventListener('mousemove', (e) => {
        if (pointerLocked) {
            yaw   -= e.movementX * 0.003;
            pitch -= e.movementY * 0.003;
            pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
            updateCameraFromYawPitch();
        } else if (isDraggingRight) {
            // Right-click drag for rotation without pointer lock
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            yaw   -= dx * 0.005;
            pitch -= dy * 0.005;
            pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
            updateCameraFromYawPitch();
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        } else if (isPanning) {
            // Middle mouse pan
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            const right = new THREE.Vector3();
            const up = new THREE.Vector3();
            right.setFromMatrixColumn(camera.matrixWorld, 0);
            up.setFromMatrixColumn(camera.matrixWorld, 1);
            camera.position.addScaledVector(right, -dx * moveSpeed * 0.02);
            camera.position.addScaledVector(up, dy * moveSpeed * 0.02);
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }
    });

    // Right-click drag for rotation
    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 2) {  // right click
            isDraggingRight = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        } else if (e.button === 1) {  // middle click
            isPanning = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            e.preventDefault();
        }
    });

    document.addEventListener('mouseup', (e) => {
        if (e.button === 2) isDraggingRight = false;
        if (e.button === 1) isPanning = false;
    });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // Keyboard
    document.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'Escape' && pointerLocked) {
            document.exitPointerLock();
        }
    });
    document.addEventListener('keyup', (e) => {
        keys[e.code] = false;
    });

    // Scroll wheel for speed
    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY < 0) {
            moveSpeed *= 1.2;
        } else {
            moveSpeed /= 1.2;
        }
        moveSpeed = Math.max(speedMin, Math.min(speedMax, moveSpeed));
    }, { passive: false });

    // Transform inputs
    ['loc-x','loc-y','loc-z','rot-p','rot-y','rot-r','scl-x','scl-y','scl-z'].forEach(id => {
        document.getElementById(id).addEventListener('input', onTransformInput);
    });

    // Camera inputs
    ['cam-x','cam-y','cam-z','cam-p','cam-ya','cam-r'].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('focus', () => { camInputFocused = true; });
        el.addEventListener('blur', () => { camInputFocused = false; });
        el.addEventListener('input', onCameraInput);
    });

    // Focus button
    document.getElementById('focus-btn').addEventListener('click', focusOnActor);

    // Export button
    document.getElementById('export-btn').addEventListener('click', exportScene);
}

// ===========================================================================
// Animation loop
// ===========================================================================
let lastTime = performance.now();

function animate() {
    requestAnimationFrame(animate);

    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    // Camera movement
    if (pointerLocked || isDraggingRight) {
        const speed = moveSpeed * dt * (keys['ShiftLeft'] || keys['ShiftRight'] ? 2 : 1);

        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        const right = new THREE.Vector3();
        right.crossVectors(forward, camera.up).normalize();

        if (keys['KeyW']) camera.position.addScaledVector(forward, speed);
        if (keys['KeyS']) camera.position.addScaledVector(forward, -speed);
        if (keys['KeyA']) camera.position.addScaledVector(right, -speed);
        if (keys['KeyD']) camera.position.addScaledVector(right, speed);
        if (keys['KeyE']) camera.position.y += speed;
        if (keys['KeyQ']) camera.position.y -= speed;
    }

    // Update camera inputs display
    updateCameraInputs();

    renderer.render(scene, camera);
}

// ===========================================================================
// Init
// ===========================================================================
(async function start() {
    const loadingText = document.getElementById('loading-text');
    loadingText.textContent = 'Fetching scene data…';
    const ok = await fetchSceneData();

    initThree();
    setupInputHandlers();
    animate();

    // Nothing to re-export in GLB mode — the file is already the artefact.
    if (mode === 'glb') {
        document.getElementById('export-btn').style.display = 'none';
    }

    if (!ok) { loadingText.textContent = 'Failed to load scene data'; return; }
    buildScene();
})();
</script>
